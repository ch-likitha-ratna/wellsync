{% extends 'base.html' %}
{% block content %}
<div class="p-6 max-w-3xl mx-auto bg-white shadow-lg rounded-lg mt-10">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Leave Request Form 📝</h2>

    <form action="{{ url_for('submit_leave') }}" method="POST" class="space-y-6">

        <!-- Leave Type -->
        <div>
            <label class="block text-sm font-medium text-gray-700">Leave Type</label>
            <select name="leave_type" required onchange="toggleSubType(this)"
                class="mt-1 w-full border rounded-md px-3 py-2 bg-white text-black focus:outline-none focus:ring focus:border-blue-300">
                <option value="">-- Select Leave Type --</option>
                <option value="Paid">Paid</option>
                <option value="Unpaid">Unpaid</option>
            </select>

        </div>

        <!-- Sub Type (Conditional) -->
        <div id="subTypeContainer" style="display: none;">
            <label class="block text-sm font-medium text-gray-700">Sub Type</label>
            <select name="sub_type"
                class="mt-1 w-full border rounded-md px-3 py-2 bg-white text-black focus:outline-none focus:ring focus:border-blue-300">
                <option value="">-- Select Sub Type --</option>
                <option value="Sick">Sick</option>
                <option value="Personal">Personal</option>
            </select>

        </div>

        <!-- Start/End Date -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Start Date</label>
                <input type="text" name="start_date" id="start_date" required
                    class="flatpickr-date mt-1 w-full border rounded-md px-3 py-2" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">End Date</label>
                <input type="text" name="end_date" id="end_date" required
                    class="flatpickr-date mt-1 w-full border rounded-md px-3 py-2" oninput="calculateDays()" />
            </div>
        </div>

        <!-- Total Days -->
        <div>
            <label class="block text-sm font-medium text-gray-700">Total Days</label>
            <input type="number" name="total_days" id="total_days" readonly
                class="mt-1 w-full border rounded-md px-3 py-2 bg-gray-100 cursor-not-allowed" />
        </div>

        <!-- Reason -->
        <div>
            <label class="block text-sm font-medium text-gray-700">Reason</label>
            <textarea name="reason" rows="3" required
                class="mt-1 w-full border rounded-md px-3 py-2 bg-white text-black focus:outline-none focus:ring focus:border-blue-300"></textarea>

        </div>

        <!-- Submit -->
        <div class="text-right">
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition">
                Submit Request
            </button>
        </div>
    </form>
</div>

<!-- Flatpickr + JS -->
<script src="{{ url_for('static', filename='js/leave_form.js') }}"></script>
{% endblock %}
