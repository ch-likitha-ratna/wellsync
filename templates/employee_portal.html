<!DOCTYPE html>
<html>
<head>
    <title>Employee Portal - NexIQon</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen">

   <!-- Top Bar -->
<div class="flex justify-between items-center bg-white px-6 py-4 border-b-2 border-gray-300">
    <h1 class="text-xl font-bold text-blue-600">NexIQon</h1>
    <a href="/logout" onclick="return confirm('Are you sure you want to logout?')" class="text-red-500 hover:text-red-400 font-semibold">Logout</a>
</div>

    <!-- Welcome Text -->
    <div class="text-center my-8">
        <h2 class="text-3xl font-bold text-blue-300">Welcome to NexIQon Employee Portal 👥</h2>
        <p class="mt-2 text-gray-300">You are now logged in as an employee.</p>
    </div>

    <!-- Quick Access Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto px-4">
        
        <a href="{{ url_for('employee_announcements') }}" class="bg-gray-800 hover:bg-gray-700 transition p-6 rounded-lg shadow text-white text-lg flex items-center space-x-2">
            <span>📢</span>
            <span>View Announcements</span>
        </a>

         <a href="{{ url_for('submit_feedback') }}" class="bg-gray-800 p-6 rounded shadow text-white text-lg hover:bg-gray-700 flex items-center">
    📝 Submit Feedback
  </a>

         <a href="#" class="bg-gray-800 hover:bg-gray-700 transition p-6 rounded-lg shadow text-white text-lg flex items-center space-x-2">
            <span>🕒</span>
            <span>Timesheet</span>
        </a>

        <a href="{{ url_for('submit_leave_request') }}" class="bg-gray-800 hover:bg-gray-700 transition p-6 rounded-lg shadow text-white text-lg flex items-center space-x-2">
            <span>🏖️</span>
            <span>Leave Requests</span>
        </a>

        <a href="{{ url_for('induction_kit') }}" class="bg-gray-800 hover:bg-gray-700 transition p-6 rounded-lg shadow text-white text-lg flex items-center space-x-2">
            <span>📦</span>
            <span>Induction Kit</span>
        </a>


    </div>

    <!-- Logout confirmation script -->
    <script>
        function confirmLogout() {
            return confirm("Are you sure you want to logout?");
        }
    </script>

    

</body>
</html>
