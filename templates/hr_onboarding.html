{% extends 'base.html' %}
{% block content %}
<div class="max-w-7xl mx-auto mt-10 p-6 bg-white rounded shadow">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">HR Employee Onboarding Panel</h2>

  <!-- ADD NEW EMPLOYEE FORM -->
  <div class="bg-gray-50 p-4 rounded-md shadow-inner mb-10">
    <h3 class="text-xl font-semibold text-gray-700 mb-3">Add New Employee</h3>
    <form action="{{ url_for('add_employee') }}" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <input type="text" name="first_name" placeholder="First Name" required class="form-control bg-white text-black">
      <input type="text" name="last_name" placeholder="Last Name" required class="form-control bg-white text-black">
      <input type="email" name="email" placeholder="Email" required class="form-control bg-white text-black">
      <input type="text" name="contact_number" placeholder="Contact Number" required
        class="form-control bg-white text-black">
      <select name="gender" required class="form-control bg-white text-black">
        <option value="">Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
      <select name="department" required class="form-control bg-white text-black">
        <option value="">Department</option>
        <option>HR</option>
        <option>IT</option>
        <option>Finance</option>
        <option>Manager</option>
        <option>Employee</option>
        <option>CTO</option>
        <option>CEO</option>
      </select>
      <input type="text" name="role_title" placeholder="Role Title" required class="form-control bg-white text-black">
      <input type="text" name="visa_type" placeholder="Visa Type" class="form-control bg-white text-black">
      <input type="number" step="0.1" name="experience_years" placeholder="Experience (in years)"
        class="form-control bg-white text-black">
      <input type="number" name="salary" placeholder="Salary" class="form-control bg-white text-black">
      <input type="text" name="location" placeholder="Location" class="form-control bg-white text-black">
      <input type="text" name="designation" placeholder="Designation" class="form-control bg-white text-black">
      <div class="md:col-span-2 text-right">
        <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700">Add Employee</button>
      </div>
    </form>
  </div>

  <!-- MANAGE EMPLOYEES TABLE -->
  <div class="bg-gray-50 p-4 rounded-md shadow-inner">
    <h3 class="text-xl font-semibold text-gray-700 mb-4">Manage Existing Employees</h3>
    <table class="min-w-full table-auto border text-sm text-center">
      <thead class="bg-gray-200 text-gray-700">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Dept</th>
          <th>Designation</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white">
        {% for emp in employees %}
        <tr class="border-t">
          <form action="{{ url_for('edit_employee', emp_id=emp.employee_id) }}" method="POST">
            <td><input name="first_name" value="{{ emp.first_name }}" class="form-control text-center" /></td>
            <td><input name="email" value="{{ emp.email }}" class="form-control text-center" /></td>
            <td><input name="contact_number" value="{{ emp.contact_number }}" class="form-control text-center" /></td>
            <td><input name="department" value="{{ emp.department }}" class="form-control text-center" /></td>
            <td><input name="designation" value="{{ emp.designation }}" class="form-control text-center" /></td>
            <td class="space-x-1">
              <button type="submit" class="bg-yellow-400 text-white px-3 py-1 rounded">Update</button>
              <a href="{{ url_for('deactivate_employee', emp_id=emp.employee_id) }}"
                class="bg-red-500 text-white px-3 py-1 rounded" onclick="return confirm('Are you sure?')">Deactivate</a>
            </td>
          </form>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
