<!-- templates/navbar.html -->
<header class="sticky top-0 z-50 flex items-center justify-between px-10 py-4 bg-white shadow text-black">
  <div class="text-2xl font-extrabold text-blue-600">NexIQon</div>

  <nav class="flex gap-10 text-lg font-semibold">
    <a href="#featured" class="text-black font-bold text-sm">WHAT WE DO</a>
    <a href="#leadership" class="text-black font-bold text-sm">WHO WE ARE</a>
    <a href="#insights" class="text-black font-bold text-sm">RESOURCES</a>
  </nav>

  <div class="flex items-center space-x-4">
    {% if session.user_name %}
      <span class="text-gray-700">{{ session.user_name }}</span>
      <a href="/logout" class="bg-red-500 hover:bg-red-600 text-white font-semibold px-4 py-2 rounded">
        Logout
      </a>
    {% else %}
      <button onclick="toggleChatbot()" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold px-4 py-2 rounded">
        Let's talk
      </button>
    {% endif %}
  </div>
</header>
